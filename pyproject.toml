[project]
name = "local-file-mcp-server-stdio"
version = "0.1.0"
description = "MCP server (stdio) for creating and renaming local files under a safe root."
readme = "README.en.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
]

[project.scripts]
local-file-mcp-server-stdio = "local_file_mcp_server_stdio.server:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_file_mcp_server_stdio"]
